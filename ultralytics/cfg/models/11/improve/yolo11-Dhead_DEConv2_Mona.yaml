# nc: 3  # number of classes 你的类别数，无需修改
# scales: # YOLO11n 轻量化核心适配，完美匹配1024输入
#   n: [0.50, 0.25, 1024]
#   s: [0.50, 0.50, 1024]
#   m: [0.50, 1.00, 512]
#   l: [1.00, 1.00, 512]
#   x: [1.00, 1.50, 512]

# # YOLO11n backbone 【层号0-10 精准无错】✅ Mona 完全替换 SPPF | 无MSCAA | 输入1024×1024
# # 替换点：原第9层的SPPF被删除，改为Mona[1024]，输入输出通道/尺寸完全一致，无缝衔接
# backbone:
#   # [from, repeats, module, args] | 特征图尺寸(H×W) | 通道数(C) | 备注
#   - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2, 512×512×64, 下采样
#   - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4, 256×256×128, 下采样
#   - [-1, 2, C3k2, [256, False, 0.25]] # 2, 256×256×256, 特征聚合
#   - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8, 128×128×256, 下采样
#   - [-1, 2, C3k2, [512, False, 0.25]] # 4, 128×128×512, 特征聚合
#   - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16, 64×64×512, 下采样
#   - [-1, 2, C3k2, [512, True]] # 6, 64×64×512, 特征聚合
#   - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32, 32×32×1024, 下采样
#   - [-1, 2, C3k2, [1024, True]] # 8, 32×32×1024, 特征聚合
#   - [-1, 1, Mona, [256]] # 9 ✅ 核心替换：Mona完全替代原SPPF模块，输入输出[32×32×1024]，无缝衔接
#   - [-1, 2, C2PSA, [1024]] # 10, 32×32×1024, 原生注意力增强，无冗余

# # YOLO11n head 【层号11-30 精准无错】✅ 保留全部DEConv细节增强 | 无MSCAA | 4个输出层完美匹配1024输入
# # 所有DEConv保留，航拍小目标细节拉满，无任何删减
# head:
#   - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11, 64×64×1024, 上采样无棋盘格
#   - [[-1, 6], 1, Concat, [1]] # cat backbone P4特征 #12, 64×64×1536
#   - [-1, 2, C3k2, [512, False]] #13, 64×64×512, 特征压缩

#   - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #14, 128×128×512, 上采样
#   - [[-1, 4], 1, Concat, [1]] # cat backbone P3特征 #15, 128×128×768
#   - [-1, 2, C3k2, [256, False]] #16 (P3/8-small), 128×128×256, 输出层前驱

#   - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #17, 256×256×256, 上采样
#   - [[-1, 2], 1, Concat, [1]] # cat backbone P2特征 #18, 256×256×384
#   - [-1, 1, DEConv, [128]] #19 ✅ 保留：P2极小目标细节增强，航拍核心层，无棋盘格
#   - [-1, 2, C3k2, [128, False]] #20 (P2/4-xsmall) 输出层1 ✔️ 256×256×128 【航拍小目标核心层】

#   - [-1, 1, Conv, [128, 3, 2]] #21, 128×128×128, 下采样
#   - [[-1, 16], 1, Concat, [1]] # cat head P3特征 #22, 128×128×384
#   - [-1, 1, DEConv, [96]] #23 ✅ 保留：P3小目标细节补充，检测更精准
#   - [-1, 2, C3k2, [256, False]] #24 (P4/16-medium) 输出层2 ✔️ 128×128×256

#   - [-1, 1, Conv, [256, 3, 2]] #25, 64×64×256, 下采样
#   - [[-1, 13], 1, Concat, [1]] # cat head P4特征 #26, 64×64×768
#   - [-1, 2, C3k2, [512, False]] #27 (P4/16-medium) 输出层3 ✔️ 64×64×512

#   - [-1, 1, Conv, [512, 3, 2]] #28, 32×32×512, 下采样
#   - [[-1, 10], 1, Concat, [1]] # cat head P5特征 #29, 32×32×1536
#   - [-1, 2, C3k2, [1024, True]] #30 (P5/32-large) 输出层4 ✔️ 32×32×1024 【必须保留，1024输入必备】

#   # ✅ Detect检测层 直接调用4个原生输出层，层号精准无错，4个尺度全覆盖，完美适配1024×1024
#   - [[20, 24, 27, 30], 1, Detect, [nc]] # Detect(P2, P3, P4, P5) 极小/小/中/大目标全检测

# nc: 3  # number of classes
# scales:
#   n: [0.50, 0.25, 1024]

# # YOLO11n backbone - Mona替换SPPF
# backbone:
#   - [-1, 1, Conv, [64, 3, 2]] # 0, 512×512×64
#   - [-1, 1, Conv, [128, 3, 2]] # 1, 256×256×128
#   - [-1, 2, C3k2, [256, False, 0.25]] # 2, 256×256×256
#   - [-1, 1, Conv, [256, 3, 2]] # 3, 128×128×256
#   - [-1, 2, C3k2, [512, False, 0.25]] # 4, 128×128×512
#   - [-1, 1, Conv, [512, 3, 2]] # 5, 64×64×512
#   - [-1, 2, C3k2, [512, True]] # 6, 64×64×512
#   - [-1, 1, Conv, [1024, 3, 2]] #7, 32×32×1024
#   - [-1, 2, C3k2, [1024, True]] #8, 32×32×1024
#   - [-1, 1, Mona, [256]] #9 ✅ Mona替换SPPF，核心全局特征增强
#   - [-1, 2, C2PSA, [1024]] #10, 32×32×1024

# # YOLO11n head - DEConv保留 + 新增1处Mona小目标增强
# head:
#   - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #11,64×64×1024
#   - [[-1,6],1,Concat,[1]] #12,64×64×1536
#   - [-1,2,C3k2,[512,False]] #13,64×64×512

#   - [-1,1,nn.Upsample,[None,2,"nearest"]] #14,128×128×512
#   - [[-1,4],1,Concat,[1]] #15,128×128×768
#   - [-1,2,C3k2,[256,False]] #16,128×128×256

#   - [-1,1,nn.Upsample,[None,2,"nearest"]] #17,256×256×256
#   - [[-1,2],1,Concat,[1]] #18,256×256×384
#   - [-1,1,DEConv,[128]] #19 ✅ DEConv小目标细节增强
#   - [-1,2,C3k2,[128,False]] #20 输出层1 ✔️256×256×128
#   - [-1,1,Mona,[32]] #21 ✅ 新增：P2小目标层Mona增强，航拍核心，无冗余

#   - [-1,1,Conv,[128,3,2]] #22,128×128×128
#   - [[-1,16],1,Concat,[1]] #23,128×128×384
#   - [-1,1,DEConv,[96]] #24 ✅ DEConv细节补充
#   - [-1,2,C3k2,[256,False]] #25 输出层2 ✔️128×128×256

#   - [-1,1,Conv,[256,3,2]] #26,64×64×256
#   - [[-1,13],1,Concat,[1]] #27,64×64×768
#   - [-1,2,C3k2,[512,False]] #28 输出层3 ✔️64×64×512

#   - [-1,1,Conv,[512,3,2]] #29,32×32×512
#   - [[-1,10],1,Concat,[1]] #30,32×32×1536
#   - [-1,2,C3k2,[1024,True]] #31 输出层4 ✔️32×32×1024

#   # ✅ Detect检测层 精准调用
#   - [[21, 25, 28, 31], 1, Detect, [nc]]

nc: 3 # number of classes
scales:
  n: [0.50, 0.25, 1024]

# YOLO11n backbone - Mona替换SPPF
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0, 512×512×64
  - [-1, 1, Conv, [128, 3, 2]] # 1, 256×256×128
  - [-1, 2, C3k2, [256, False, 0.25]] # 2, 256×256×256
  - [-1, 1, Conv, [256, 3, 2]] # 3, 128×128×256
  - [-1, 2, C3k2, [512, False, 0.25]] # 4, 128×128×512
  - [-1, 1, Conv, [512, 3, 2]] # 5, 64×64×512
  - [-1, 2, C3k2, [512, True]] # 6, 64×64×512
  - [-1, 1, Conv, [1024, 3, 2]] #7, 32×32×1024
  - [-1, 2, C3k2, [1024, True]] #8, 32×32×1024
  - [-1, 1, Mona, [256]] #9 ✅ Mona替换SPPF，核心全局特征增强
  - [-1, 2, C2PSA, [1024]] #10, 32×32×1024

# YOLO11n head - DEConv保留 + 新增1处Mona小目标增强
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #11,64×64×1024
  - [[-1, 6], 1, Concat, [1]] #12,64×64×1536
  - [-1, 2, C3k2, [512, False]] #13,64×64×512

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #14,128×128×512
  - [[-1, 4], 1, Concat, [1]] #15,128×128×768
  - [-1, 2, C3k2, [256, False]] #16,128×128×256

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #17,256×256×256
  - [[-1, 2], 1, Concat, [1]] #18,256×256×384
  - [-1, 1, DEConv, [128]] #19 ✅ DEConv小目标细节增强
  - [-1, 2, C3k2, [128, False]] #20 输出层1 ✔️256×256×128
  - [-1, 1, Mona, [32]] #21 ✅ 新增：P2小目标层Mona增强，航拍核心，无冗余

  - [-1, 1, Conv, [128, 3, 2]] #22,128×128×128
  - [[-1, 16], 1, Concat, [1]] #23,128×128×384
  - [-1, 1, DEConv, [96]] #24 ✅ DEConv细节补充
  - [-1, 2, C3k2, [256, False]] #25 输出层2 ✔️128×128×256

  - [-1, 1, Conv, [256, 3, 2]] #26,64×64×256
  - [[-1, 13], 1, Concat, [1]] #27,64×64×768
  - [-1, 2, C3k2, [512, False]] #28 输出层3 ✔️64×64×512

  # - [-1,1,Conv,[512,3,2]] #29,32×32×512
  # - [[-1,10],1,Concat,[1]] #30,32×32×1536
  # - [-1,2,C3k2,[1024,True]] #31 输出层4 ✔️32×32×1024

  # ✅ Detect检测层 精准调用
  - [[21, 25, 28], 1, Detect, [nc]]
