#############    删除所有DEConv | 仅3处EFC特征融合

# Ultralytics YOLO11n - 基础优化版：删除DEConv + 仅Concat后EFC特征融合
# 无参数错误 | 通道精准匹配 | 纯原生主干 | 航拍小目标友好
nc: 3  # 你的数据集类别数，保持不变
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n 原生主干 0-10层 | 无任何修改 | 特征提取无侵入
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] #7-P5/32
  - [-1, 2, C3k2, [1024, True]] #8
  - [-1, 1, SPPF, [1024, 5]] #9
  - [-1, 2, C2PSA, [1024]] #10

# Head层 11-30层 | 删除所有DEConv | 仅3处EFC特征融合 | 通道精准匹配1024/768/384
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 特征融合节点1 # 12
  # - [-1, 1, EFC, [384, 384]] # 13 ✅ EFC特征融合1：Concat后必加，通道=512+512=1024（绝对精准）
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #15
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3 特征融合节点2 #16
  - [-1, 1, EFC, [256, 256]] #17 ✅ EFC特征融合2：通道=256+512=768（绝对精准）
  - [-1, 2, C3k2, [256, False]] #18 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #19
