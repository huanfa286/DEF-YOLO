# scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
#   # [depth, width, max_channels]
#   n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
#   s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
#   m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
#   l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
#   x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# # YOLO11n backbone 【层号注释100%精准 0-10】
# backbone:
#   # [from, repeats, module, args]
#   - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
#   - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
#   - [-1, 2, C3k2, [256, False, 0.25]] # 2
#   - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
#   - [-1, 2, C3k2, [512, False, 0.25]] # 4
#   - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
#   - [-1, 2, C3k2, [512, True]] # 6
#   - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
#   - [-1, 2, C3k2, [1024, True]] # 8
#   - [-1, 1, SPPF, [1024, 5]] # 9
#   - [-1, 2, C2PSA, [1024]] # 10

# # YOLO11n head 【层号注释100%精准 11-34】 含2个新增DEConv，全部计入行数
# head:
#   - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
#   - [[-1, 6], 1, Concat, [1]] # cat backbone P4 # 12
#   - [-1, 2, C3k2, [512, False]] # 13

#   - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
#   - [[-1, 4], 1, Concat, [1]] # cat backbone P3 # 15
#   - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

#   - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
#   - [[-1, 2], 1, Concat, [1]] # cat head P2 # 18
#   - [-1, 1, DEConv, [128]] # 19 ✅ 新增：P2细节增强
#   - [-1, 2, C3k2, [128, False]] # 20 (P2/4-xsmall) 输出层1 ✔️

#   - [-1, 1, Conv, [128, 3, 2]] # 21
#   - [[-1, 16], 1, Concat, [1]] # cat head P3 # 22
#   # - [-1, 1, DEConv, [96]] # 23 ✅ 新增：P3细节增强
#   - [-1, 2, C3k2, [256, False]] # 24 (P4/16-medium) 输出层2 ✔️

#   - [-1, 1, Conv, [256, 3, 2]] # 25
#   - [[-1, 13], 1, Concat, [1]] # cat head P4 # 26
#   - [-1, 2, C3k2, [512, False]] # 27 (P4/16-medium) 输出层3 ✔️

#   # - [-1, 1, Conv, [512, 3, 2]] # 28
#   # - [[-1, 10], 1, Concat, [1]] # cat head P5 # 29
#   # - [-1, 2, C3k2, [1024, True]] # 30 (P5/32-large) 输出层4 ✔️

#   - [20, 1, MSCAAttention, []] # 28
#   - [23, 1, MSCAAttention, []] # 29
#   - [26, 1, MSCAAttention, []] # 30
#   # - [30, 1, MSCAAttention, []] # 34


#   - [[27, 28, 29], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)


nc: 3  # number of classes 你的类别数，无需修改
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone 【层号0-10 精准无错】输入1024×1024
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2, 512×512×64
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4, 256×256×128
  - [-1, 2, C3k2, [256, False, 0.25]] # 2, 256×256×256
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8, 128×128×256
  - [-1, 2, C3k2, [512, False, 0.25]] # 4, 128×128×512
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16, 64×64×512
  - [-1, 2, C3k2, [512, True]] # 6, 64×64×512
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32, 32×32×1024
  - [-1, 2, C3k2, [1024, True]] # 8, 32×32×1024
  - [-1, 1, SPPF, [1024, 5]] # 9, 32×32×1024
  - [-1, 2, C2PSA, [1024]] # 10, 32×32×1024

# YOLO11n head 【层号11-34 修正后精准无错】适配1024×1024 + DEConv细节增强 + MSCAA注意力 航拍专用
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11, 64×64×1024
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 #12, 64×64×1536
  - [-1, 2, C3k2, [512, False]] #13, 64×64×512

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #14, 128×128×512
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3 #15, 128×128×768
  - [-1, 2, C3k2, [256, False]] #16 (P3/8-small), 128×128×256

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #17, 256×256×256
  - [[-1, 2], 1, Concat, [1]] # cat head P2 #18, 256×256×384
  - [-1, 1, DEConv, [128]] #19 ✅ P2细节增强，航拍小目标核心, 256×256×128
  - [-1, 2, C3k2, [128, False]] #20 (P2/4-xsmall) 输出层1 ✔️ 256×256×128

  - [-1, 1, Conv, [128, 3, 2]] #21, 128×128×128
  - [[-1, 4, 16], 1, Concat, [1]] # cat head P3 #22, 128×128×384
  # - [-1, 1, DEConv, [224]] #23 ✅ P3细节增强, 128×128×96
  - [-1, 2, C3k2, [256, False]] #24 (P4/16-medium) 输出层2 ✔️ 128×128×256

  - [-1, 1, Conv, [256, 3, 2]] #25, 64×64×256
  - [[-1, 13], 1, Concat, [1]] # cat head P4 #26, 64×64×768
  - [-1, 2, C3k2, [512, False]] #27 (P4/16-medium) 输出层3 ✔️ 64×64×512

  # - [-1, 1, Conv, [512, 3, 2]] #28 ✅ 恢复必补层, 32×32×512
  # - [[-1, 10], 1, Concat, [1]] # cat head P5 #29 ✅ 恢复必补层, 32×32×1536
  # - [-1, 2, C3k2, [1024, True]] #30 (P5/32-large) 输出层4 ✔️ 32×32×1024 ✅必须保留

  # ✅ MSCAA注意力模块 补全通道参数，无报错，4个尺度全覆盖，航拍小目标拉满
  - [20, 1, MSCAAttention, []] #31 P2小目标层 256×256×128
  - [23, 1, MSCAAttention, []] #32 P3中目标层 128×128×256
  - [26, 1, MSCAAttention, []] #33 P4大目标层 64×64×512
  # - [30, 1, MSCAAttention, [1024]] #34 P5超大目标层 32×32×1024

  # ✅ Detect检测层 修正调用层号，4个层匹配4个尺度，完美适配1024×1024，无任何错位
  - [[26, 27, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)