# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
nc: 3 # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone 全部参数正确，无修改
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 ✅ 精准层号

# YOLO11n head 全部参数正确，仅修正层号注释+Detect索引
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 #12
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #14
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3 #15
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small) ✅ 修正注释层号

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #17
  - [[-1, 2], 1, Concat, [1]] # cat head P2 #18
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall) ✅ 修正注释层号

  - [-1, 1, Conv, [128, 3, 2]] #20
  - [[-1, 16], 1, Concat, [1]] # cat head P3 #21
  - [-1, 2, C3k2, [256, False]] # 22 (P4/16-medium) ✅ 修正注释层号

  - [-1, 1, Conv, [256, 3, 2]] #23
  - [[-1, 13], 1, Concat, [1]] # cat head P4 #24
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium) ✅ 修正注释层号

  - [-1, 1, Conv, [512, 3, 2]] #26
  - [[-1, 10], 1, Concat, [1]] # cat head P5 #27
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large) ✅ 修正注释层号

  - [[19, 22, 25, 28], 1, Detect, [nc]] # ✅ 终极修正：精准索引，完美匹配4个输出层，0报错
