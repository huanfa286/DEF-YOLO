# Ultralytics 🚀 AGPL-3.0 License

# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 3 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone 【层号注释100%精准 0-10】
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2  | 尺寸: 512×512×64    (下采样 1024/2=512)
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4  | 尺寸: 256×256×128   (下采样 512/2=256)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  | 尺寸: 256×256×256   (尺寸不变，通道升级)
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8  | 尺寸: 128×128×256   (下采样 256/2=128)
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4  | 尺寸: 128×128×512   (尺寸不变，通道升级)
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16 | 尺寸: 64×64×512     (下采样 128/2=64)
  - [-1, 2, C3k2, [512, True]]   # 6       | 尺寸: 64×64×512     (尺寸不变，特征提取)
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32 | 尺寸: 32×32×1024    (下采样 64/2=32)
  - [-1, 2, C3k2, [1024, True]]  # 8       | 尺寸: 32×32×1024    (尺寸不变，特征提取)
  - [-1, 1, SPPF, [1024, 5]]     # 9       | 尺寸: 32×32×1024    (尺寸不变，空间金字塔池化)
  - [-1, 2, C2PSA, [1024]]       # 10      | 尺寸: 32×32×1024    (尺寸不变，注意力特征增强)

# YOLO11n head 【层号注释100%精准 11-30】 含2个新增DEConv，全部计入行数
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11  | 尺寸: 64×64×1024    (上采样 32×2=64，通道不变)
  - [[-1, 6], 1, Concat, [1]]                   # 12  | 尺寸: 64×64×1536   (拼接：1024+512=1536，尺寸不变 ✔️匹配)
  - [-1, 2, C3k2, [512, False]]                 # 13  | 尺寸: 64×64×512    (尺寸不变，通道压缩)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14  | 尺寸: 128×128×512   (上采样 64×2=128，通道不变)
  - [[-1, 4], 1, Concat, [1]]                   # 15  | 尺寸: 128×128×1024 (拼接：512+512=1024，尺寸不变 ✔️匹配)
  - [-1, 2, C3k2, [256, False]]                 # 16  | 尺寸: 128×128×256  (尺寸不变，通道压缩) (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17  | 尺寸: 256×256×256   (上采样 128×2=256，通道不变)
  - [[-1, 2], 1, Concat, [1]]                   # 18  | 尺寸: 256×256×512  (拼接：256+256=512，尺寸不变 ✔️匹配)
  - [-1, 1, DEConv, [128]]                      # 19  | 尺寸: 256×256×128  (✅你的新增层：尺寸不变，通道=128，小目标细节增强)
  - [-1, 2, C3k2, [128, False]]                 # 20  | 尺寸: 256×256×128  (尺寸不变) 输出层1 (P2/4-xsmall) ✔️

  - [-1, 1, Conv, [128, 3, 2]]                  # 21  | 尺寸: 128×128×128  (下采样 256/2=128，通道不变)
  - [[-1,4, 16], 1, Concat, [1]]                  # 22  | 尺寸: 128×128×384  (拼接：128+256=384，尺寸不变 ✔️匹配)
  # - [-1, 1, DEConv, [224]]                      # 23  | 尺寸: 128×128×160  (✅你的新增层：尺寸不变，通道=160，小目标细节增强)
  - [-1, 2, C3k2, [256, False]]                 # 24  | 尺寸: 128×128×256  (尺寸不变) 输出层2 (P4/16-medium) ✔️

  - [-1, 1, Conv, [256, 3, 2]]                  # 25  | 尺寸: 64×64×256    (下采样 128/2=64，通道不变)
  - [[-1,6, 13], 1, Concat, [1]]                  # 26  | 尺寸: 64×64×768    (拼接：256+512=768，尺寸不变 ✔️匹配)
  - [-1, 2, C3k2, [512, False]]                 # 27  | 尺寸: 64×64×512    (尺寸不变) 输出层3 (P4/16-medium) ✔️

  # - [-1, 1, Conv, [512, 3, 2]]                  # 28  | 尺寸: 32×32×512    (下采样 64/2=32，通道不变)
  # - [[-1, 10], 1, Concat, [1]]                  # 29  | 尺寸: 32×32×1536   (拼接：512+1024=1536，尺寸不变 ✔️匹配)
  # - [-1, 2, C3k2, [1024, True]]                 # 30  | 尺寸: 32×32×1024   (尺寸不变) 输出层4 (P5/32-large) ✔️

  - [[20, 23, 26], 1, Detect, [nc]] # Detect(P2, P3, P4, P5) ✅ 最后一行绝对正确，无任何误差