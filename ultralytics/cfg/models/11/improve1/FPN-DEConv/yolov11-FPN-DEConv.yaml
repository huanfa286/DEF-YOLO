# YOLO11 small-object model with shallow feature fusion and DEConv.

nc: 3
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

  # Auxiliary shallow features used by the FPN path.
  - [0, 1, Conv, [128, 3, 2]]
  - [1, 1, Conv, [256, 3, 2]]
  - [4, 1, Conv, [512, 3, 2]]

head:
  # P4/16 -> P3/8 -> P2/4 top-down path.
  - [-4, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, DEConv, []]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, DEConv, []]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, DEConv, []]
  - [-1, 2, C3k2, [256, False]]

  # P2/4 -> P3/8 -> P4/16 bottom-up path.
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 1, DEConv, []]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 1, DEConv, []]
  - [-1, 2, C3k2, [1024, True]]

  # Keep the P2/4 head for small objects; do not replace it with P5/32.
  - [[28, 32, 36], 1, Detect, [nc]]
