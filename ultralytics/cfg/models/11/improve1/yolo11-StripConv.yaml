#  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
#  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
#  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs
#
#backbone:
#  # [from, repeats, module, args]          特征图尺寸 | 输出通道 | 说明
#  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2    512×512    | 64       | stride=2下采样，尺寸1024/2=512
#  - [-1, 1, Conv, [128, 3, 2]] #1-P2/4    256×256    | 128      | stride=2下采样，尺寸512/2=256
#  - [-1, 2, C3k2, [256, False, 0.25]]    # 256×256    | 256      | 仅通道升维，尺寸不变
#  - [-1, 1, Conv, [256, 3, 2]] #3-P3/8    128×128    | 256      | stride=2下采样，尺寸256/2=128 ✅核心P3层
#  - [ -2, 1, Conv, [ 512, 3, 4 ] ]    # 4
#
#  - [-2, 2, C3k2, [512, False, 0.25]]     #128×128    | 512      | 仅通道升维，尺寸不变
#  - [-1, 1, Conv, [512, 3, 2]] #5-P4/16    64×64     | 512      | stride=2下采样，尺寸128/2=64 ✅核心P4层
#  - [-1, 2, C3k2, [512, True]]            # 64×64     | 512      | 仅通道不变，尺寸不变
#  - [-1, 1, Conv, [1024, 3, 2]] #7-P5/32   32×32     | 1024     | stride=2下采样，尺寸64/2=32 ✅核心P5层
#  - [-1, 2, C3k2, [1024, True]]            #32×32     | 1024     | 仅通道不变，尺寸不变
#  - [-1, 1, SPPF, [1024, 5]] #9            32×32     | 1024     | 空间金字塔池化，尺寸不变
#  - [-1, 2, C2PSA, [1024]] #10             32×32     | 1024     | 注意力增强，尺寸不变
#
#
#head:
#  # [from, repeats, module, args]          特征图尺寸 | 输出通道 | 说明 & 拼接匹配验证
#  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 64×64  | 1024    | 上采样×2，32×2=64 ✅
#  - [[-1, 4], 1, Concat, [1]]
#  - [[-1, 7], 1, Concat, [1]] # cat P4     64×64     | 1536    | 拼接：当前层64×64×1024 + backbone第6层64×64×512 → 通道叠加，尺寸不变 ✔️你原始索引正确
#
#  - [-1, 2, C3k2, [512, False]] #13        64×64     | 512     | 通道降维，尺寸不变 ✅核心P4中间层
#
#  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 128×128 | 512    | 上采样×2，64×2=128 ✅
#  - [[-1, 5], 1, Concat, [1]] # cat P3     128×128   | 768     | 拼接：当前层128×128×512 + backbone第4层128×128×256 → 通道叠加，尺寸不变 ✔️你原始索引正确
#  - [-1, 2, C3k2, [256, False]] #16        128×128   | 256     | 通道降维，尺寸不变 ✅核心P3输出层 (小目标检测)
#
#  - [-1, 1, Conv, [256, 3, 2]]             # 64×64     | 256     | stride=2下采样，128/2=64 ✅
#  - [[-1, 15], 1, Concat, [1]] # cat P4    64×64     | 768     | 拼接：当前层64×64×256 + head第13层64×64×512 → 通道叠加，尺寸不变 ✔️你原始索引正确
#  - [-1, 2, C3k2, [512, False]] #19        64×64     | 512     | 通道降维，尺寸不变 ✅核心P4输出层 (中目标检测)
#
#  - [-1, 1, Conv, [512, 3, 2]]             # 32×32     | 512     | stride=2下采样，64/2=32 ✅
#  - [[-1, 11], 1, Concat, [1]] # cat P5    32×32     | 1536    | 拼接：当前层32×32×512 + backbone第10层32×32×1024 → 通道叠加，尺寸不变 ✔️你原始索引正确
#  - [-1, 2, C3k2, [1024, True]] #22        32×32     | 1024    | 通道升维，尺寸不变 ✅核心P5输出层 (大目标检测)
#
#  - [[18, 21, 24], 1, Detect, [nc]]        # 多尺度融合 | 80+4*10 | Detect层融合3个尺寸特征图：128×128(P3)+64×64(P4)+32×32(P5) ✔️你原始索引绝对正确

